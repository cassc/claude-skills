<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <select id="lesson" aria-label="Lesson"></select>
  <button id="chat-toggle">Claude</button>
</header>
<main>
  <section id="deck">
    <div id="progress"><div id="bar"></div></div>
    <p id="kind"></p>
    <article id="card" tabindex="0"></article>
    <nav>
      <button id="prev">&larr; Back</button>
      <span id="pos"></span>
      <button id="next">Next &rarr;</button>
    </nav>
    <p class="hint">Arrow keys to move. Space to show the answer or the next diagram step.</p>
  </section>
  <aside id="chat" hidden>
    <div class="tabs">
      <button data-mode="ask" class="on">Ask about this card</button>
      <button data-mode="quiz">Quiz me</button>
    </div>
    <div id="log-ask" class="log"></div>
    <div id="log-quiz" class="log" hidden></div>
    <form id="chat-form">
      <textarea id="msg" rows="3" placeholder="Ask a question about this card"></textarea>
      <div class="row">
        <button type="button" id="chat-new">New chat</button>
        <button type="submit">Send</button>
      </div>
    </form>
  </aside>
</main>
<script src="cards.js"></script>
<script src="quiz.js"></script>
<script src="diagrams.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
